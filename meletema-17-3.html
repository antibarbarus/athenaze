<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Μελέτημα 17.3</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono&display=swap">
  <style>
    body {
      margin: 20px;
      font-family: 'Fira Mono', monospace;
      font-size: 16px;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    h1 {
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
      font-weight: normal;
    }

    table {
      border-collapse: collapse;
      margin-top: 24px;
      min-width: 900px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px 12px;
      text-align: center;
      vertical-align: middle;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      white-space: nowrap;
      font-weight: bold;
    }

    thead th {
      background: #f6f6f6;
    }

    input[type="text"] {
      font-family: 'Fira Mono', monospace;
      font-size: 16px;
      padding: 5px 7px;
      width: 135px;
      border: 1px solid #ccc;
      border-radius: 3px;
      transition: background-color 0.3s;
      text-align: center;
    }

    .given {
      font-weight: bold;
    }

    .correct { background-color: lightgreen; }
    .almost-correct { background-color: gold; }
    .incorrect { background-color: lightcoral; }

    .result {
      font-weight: bold;
      margin-top: 18px;
      padding: 10px;
      border-radius: 5px;
    }

    @media (max-width: 980px) {
      .table-wrap {
        overflow-x: auto;
      }
      table {
        min-width: 820px;
      }
    }
  </style>
</head>
<body>
  <p><a href="meletemata.html">&lt; назад</a></p>

  <h1>Μελέτημα 17.3</h1>
  <h2>Заполните таблицу, вписав остальные формы будущего времени изъявительного наклонения</h2>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>λύω</th>
          <th>ὠφελέω</th>
          <th>γιγνώσκω</th>
          <th>πλέω</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>I sing.</td>
          <td><input type="text" id="gap1"></td>
          <td><input type="text" id="gap2"></td>
          <td><input type="text" id="gap3"></td>
          <td class="given">πλεύσομαι</td>
        </tr>
        <tr>
          <td>II sing.</td>
          <td><input type="text" id="gap4"></td>
          <td><input type="text" id="gap5"></td>
          <td><input type="text" id="gap6"></td>
          <td><input type="text" id="gap7"></td>
        </tr>
        <tr>
          <td>III sing.</td>
          <td><input type="text" id="gap8"></td>
          <td class="given">ὠφελήσει</td>
          <td><input type="text" id="gap9"></td>
          <td><input type="text" id="gap10"></td>
        </tr>
        <tr>
          <td>I plur.</td>
          <td class="given">λύσομεν</td>
          <td><input type="text" id="gap11"></td>
          <td><input type="text" id="gap12"></td>
          <td><input type="text" id="gap13"></td>
        </tr>
        <tr>
          <td>II plur.</td>
          <td><input type="text" id="gap14"></td>
          <td><input type="text" id="gap15"></td>
          <td class="given">γνώσεσθε</td>
          <td><input type="text" id="gap16"></td>
        </tr>
        <tr>
          <td>III plur.</td>
          <td><input type="text" id="gap17"></td>
          <td><input type="text" id="gap18"></td>
          <td><input type="text" id="gap19"></td>
          <td><input type="text" id="gap20"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <p class="result" id="result"></p>

  <script>
    const answers = [
      ["λύσω"],
      ["ὠφελήσω"],
      ["γνώσομαι"],
      ["λύσεις"],
      ["ὠφελήσεις"],
      ["γνώσῃ", "γνώσει"],
      ["πλεύσῃ", "πλεύσει"],
      ["λύσει"],
      ["γνώσεται"],
      ["πλεύσεται"],
      ["ὠφελήσομεν"],
      ["γνωσόμεθα"],
      ["πλευσόμεθα"],
      ["λύσετε"],
      ["ὠφελήσετε"],
      ["πλεύσεσθε"],
      ["λύσουσιν", "λύσουσι"],
      ["ὠφελήσουσιν", "ὠφελήσουσι"],
      ["γνώσονται"],
      ["πλεύσονται"]
    ];

    const removeDiacritics = (str) => {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    };

    const setStyles = (element, status) => {
      element.classList.remove('correct', 'almost-correct', 'incorrect');
      if (status === 'correct') {
        element.classList.add('correct');
      } else if (status === 'almost-correct') {
        element.classList.add('almost-correct');
      } else if (status === 'incorrect') {
        element.classList.add('incorrect');
      }
    };

    const checkSingleAnswer = (index) => {
      const input = document.getElementById(`gap${index + 1}`);
      const user = input.value.trim();
      const accepted = answers[index];

      if (user === '') {
        setStyles(input, '');
        return;
      }

      if (accepted.includes(user)) {
        setStyles(input, 'correct');
        return;
      }

      const normalizedUser = removeDiacritics(user.toLowerCase());
      const near = accepted.some(ans =>
        removeDiacritics(ans.toLowerCase()) === normalizedUser
      );

      setStyles(input, near ? 'almost-correct' : 'incorrect');
    };

    const updateResults = () => {
      let correct = 0;
      let almost = 0;

      answers.forEach((accepted, i) => {
        const user = document.getElementById(`gap${i + 1}`).value.trim();

        if (accepted.includes(user)) {
          correct++;
        } else if (user !== '') {
          const normalizedUser = removeDiacritics(user.toLowerCase());
          if (accepted.some(ans =>
            removeDiacritics(ans.toLowerCase()) === normalizedUser
          )) {
            almost++;
          }
        }
      });

      const result = document.getElementById('result');

      if (correct === answers.length) {
        result.textContent = 'Все ответы правильные! Отличная работа!';
        result.style.backgroundColor = 'lightgreen';
      } else if (almost > 0) {
        result.textContent = `${correct} из ${answers.length} ответов правильны, ${almost} почти правильны (ошибка в диакритике или регистре).`;
        result.style.backgroundColor = '';
      } else {
        result.textContent = `${correct} из ${answers.length} ответов правильны.`;
        result.style.backgroundColor = '';
      }
    };

    window.onload = () => {
      answers.forEach((_, i) => {
        const input = document.getElementById(`gap${i + 1}`);
        input.addEventListener('input', () => {
          checkSingleAnswer(i);
          updateResults();
        });
      });

      updateResults();
    };
  </script>
</body>
</html>
