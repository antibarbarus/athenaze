<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Μελέτημα 4.24</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono&display=swap"><style>
body{font-family:'Fira Mono',monospace;font-size:16px;line-height:1.65;margin:20px;max-width:1050px}a{color:inherit}h1{margin:8px 0}h2{font-weight:normal;font-size:18px;margin:0 0 14px}.intro{margin:0 0 20px}.exercise{margin:12px 0 21px;line-height:2.25;font-size:19px}.options{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;vertical-align:middle}.choice{display:inline-block;border:1px solid transparent;border-radius:4px;font:inherit;font-size:19px;background:transparent;cursor:pointer;padding:1px 4px;color:inherit}.choice:hover{background:#f1f1f1}.choice.selected{text-decoration:underline;text-underline-offset:5px;border-color:#bbb;background:#f5f5f5}.choice.correct{background:lightgreen;border-color:#77b976}.choice.wrong{background:lightcoral;border-color:#cd7171}.num{font-size:16px}.result{font-weight:bold;margin-top:22px}button.reset{font:14px 'Fira Mono',monospace;padding:8px 12px;border:1px solid #bbb;background:#f6f6f6;border-radius:4px;cursor:pointer}.footer{font-size:14px;margin-top:28px}@media(max-width:600px){.exercise,.choice{font-size:17px}.options{gap:3px}}
</style></head><body><p><a href="meletemata.html">&lt; назад</a></p><h1>Μελέτημα 4.24</h1><h2>Найдите лишнее слово в каждой группе из четырёх слов.</h2><p class="intro">Выберите слово, которое отличается от остальных по грамматической форме или значению. Нажмите на нужный вариант: правильный ответ подсветится зелёным, неправильный — красным.</p><div id="exercises"></div><p id="result" class="result" aria-live="polite"></p><button class="reset" type="button" id="reset">Очистить ответы</button><p class="footer">Справка: <a href="https://antibarbarus.github.io/athenaze/grammar-volume-1.html">Грамматика древнегреческого языка</a></p>
<script>
const data=[
{options:['γεωργοῦ','δεσπότου','ἀγγέλου','ἄγροικος'],correct:3},
{options:['κώμας','κρήνας','δούλας','ἀγοράς'],correct:2},
{options:['ἔργα','μάλιστα','πρόβατα','χωρία'],correct:1}
];
const selections=Array(data.length).fill(null);const root=document.getElementById('exercises');
data.forEach((it,i)=>{const line=document.createElement('div');line.className='exercise';const n=document.createElement('span');n.className='num';n.textContent=(i+1)+'. ';line.appendChild(n);const opts=document.createElement('span');opts.className='options';it.options.forEach((v,j)=>{if(j)opts.append(document.createTextNode(', '));const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=v;b.setAttribute('aria-label',`Группа ${i+1}: ${v}`);b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{selections[i]=j;refresh();});opts.appendChild(b)});line.append(opts,document.createTextNode('.'));root.appendChild(line)});
function refresh(){let correct=0;[...root.children].forEach((line,i)=>{line.querySelectorAll('.choice').forEach((b,j)=>{const selected=selections[i]===j;b.classList.toggle('selected',selected);b.classList.toggle('correct',selected&&j===data[i].correct);b.classList.toggle('wrong',selected&&j!==data[i].correct);b.setAttribute('aria-pressed',String(selected));});if(selections[i]===data[i].correct)correct++});document.getElementById('result').textContent=`Правильно: ${correct} из ${data.length}.`}
document.getElementById('reset').addEventListener('click',()=>{selections.fill(null);refresh()});refresh();
</script></body></html>
