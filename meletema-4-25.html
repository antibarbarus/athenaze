<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Μελέτημα 4.25</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono&display=swap"><style>body{margin:20px;font:16px/1.65 'Fira Mono',monospace;color:#222}a{color:#276392}h1{margin:.4em 0}h2{font-size:17px;font-weight:normal;margin:0 0 22px}.exercise{max-width:1030px}.item{margin:0 0 23px;padding-bottom:18px;border-bottom:1px solid #e6e6e6}.question{font-size:19px;line-height:1.85;margin:0 0 10px}.answer{display:block;width:100%;box-sizing:border-box;min-height:74px;padding:9px;font:17px/1.6 'Fira Mono',monospace;border:1px solid #aaa;border-radius:3px;resize:vertical}.sample{margin-top:10px}.sample summary{cursor:pointer;color:#275e86}.sample .text{font-size:18px;line-height:1.8;margin:9px 0 4px}.translation{font-size:15px;color:#555;margin:4px 0 0}.controls button{font:inherit;padding:6px 12px;cursor:pointer}footer{margin-top:30px;color:#666;font-size:14px}</style></head><body><p><a href="meletemata.html">&lt; назад</a></p><h1>Μελέτημα 4.25</h1><h2>Ответьте на вопросы по тексту IV главы <i>Athenaze</i> полными предложениями на древнегреческом языке.</h2><main class="exercise" id="exercise"></main><div class="controls"><button type="button" id="clear">Очистить ответы</button></div><footer>Образцы ответов основаны на рассказе главы IV (стр. 55–74). Возможны и другие правильные формулировки.</footer><script>const items=[["Τί ἥ τε Μυρρίνη καὶ ἡ Μέλιττα ἐν νῷ ἔχουσι ποιεῖν;", "Ἥ τε Μυρρίνη καὶ ἡ Μέλιττα ἐν νῷ ἔχουσι πρὸς τὸ ἄστυ βαδίζειν καὶ τὴν ἑορτὴν θεωρεῖν.", "Миррина и Мелитта намерены пойти в город и посмотреть праздник. (Ср. стр. 60, 69.)"], ["Τί κακὸν πάσχει ἡ Μέλιττα ἐν ᾧ βαδίζει πρὸς τὴν κρήνην;", "Ἡ Μέλιττα ἐν τῇ ὁδῷ πταίει καὶ καταβάλλει τὴν ὑδρίαν πρὸς τὴν γῆν καὶ θραύει αὐτήν.", "Мелитта спотыкается по дороге, роняет гидрию и разбивает её. (Стр. 67.)"], ["Πόθεν ἥκει ἡ Νέαιρα;", "Ἡ Νέαιρα ἀπὸ τοῦ ἄστεως ἥκει.", "Неэра приходит из города. (Стр. 68.)"], ["Λέγε περὶ τῶν Ἀθηνῶν καὶ τῆς περὶ αὐτὰς χώρας.", "Αἱ Ἀθῆναι μεγάλην ἀγορὰν ἔχουσι, καὶ πολλὰ καπηλεῖα καὶ ἐργαστήρια ἐν ταῖς ὁδοῖς ἐστιν. Καλὴ δὲ ἡ θάλαττα ἡ παρὰ τὰς Ἀθήνας καὶ ἡ περὶ τὸ ἄστυ χώρα· σῖτος γὰρ πολὺς καὶ πρόβατα καὶ δένδρα καρποφόρα ἐστίν.", "В Афинах большая агора, много лавок и мастерских. Море и окрестная земля богаты: здесь есть хлеб, овцы и плодовые деревья. (Стр. 68–71.)"], ["Πόθεν ἥκουσιν οἱ ἄνθρωποι βουλόμενοι τὴν ἑορτὴν θεωρεῖν;", "Οἱ ἄνθρωποι ἐκ τῆς θαλάττης καὶ ἀπὸ τοῦ Πειραιῶς καὶ ἀπὸ τῶν ἀγρῶν τῶν περὶ τὸ ἄστυ ἥκουσιν.", "Люди приходят с моря, из Пирея и с полей вокруг города. (Стр. 69.)"], ["Τί φέρει τὰ χωρία τὰ περὶ τὰς Ἀθήνας;", "Τὰ χωρία τὰ περὶ τὰς Ἀθήνας σῖτον πολὺν καὶ οἶνον καὶ σῦκα καὶ ἔλαιον φέρει· πρόβατα δὲ καὶ δένδρα καρποφόρα ἐν αὐτοῖς ἐστιν.", "Окрестности Афин дают много зерна, вина, инжира и масла; там также есть овцы и плодовые деревья. (Стр. 70.)"], ["Τί ἐστιν ἐν τῇ τοῦ Πειραιῶς ἀγορᾷ καὶ ἐν ταῖς ὁδοῖς;", "Πολλὰ μὲν καπηλεῖα ἐν τῇ ἀγορᾷ ἐστιν, πολλὰ δὲ ἐργαστήρια ἐν ταῖς ὁδοῖς.", "На агоре много лавок, а на улицах много мастерских. В тексте эти сведения следуют за рассказом о Пирее и переходе в город. (Стр. 69–71.)"], ["Τί ποιοῦσιν ἐν τοῖς ἐργαστηρίοις οἱ ἄνθρωποι;", "Ἐν τοῖς ἐργαστηρίοις οἱ ἄνθρωποι κλίνας καὶ τραπέζας καὶ θύρας ποιοῦσιν· ὁ μὲν τὰς κλίνας ποιεῖ, ὁ δὲ τὰς τραπέζας, ὁ δὲ τὰς θύρας.", "В мастерских изготовляют кровати, столы и двери; разные мастера занимаются разными изделиями. (Стр. 71.)"], ["Τί ποιεῖ ἡ Μέλιττα ἐν τῇ οἰκίᾳ;", "Ἡ Μέλιττα ἐν τῇ οἰκίᾳ ὑδρίαν ζητεῖ, καὶ ἐπὶ τῇ τραπέζῃ ὑδρίαν εὑρίσκει· λαμβάνει οὖν αὐτὴν καὶ πρὸς τὴν κρήνην αὖθις σπεύδει.", "Мелитта ищет дома гидрию, находит её на столе, берёт и снова спешит к источнику. (Стр. 71–72.)"], ["Τί λέγει ἡ Μυρρίνη ὅτε τῇ Μελίττῃ ἐντυγχάνει ἐν τῇ ὁδῷ;", "Ἡ Μυρρίνη λέγει· «Τί ποιεῖς, ὦ Μέλιττα; Διὰ τί ἔτι ἐνταῦθα μένεις; Ἀλλὰ σπεῦδε· ἴθι ταχέως πρὸς τὴν κρήνην καὶ ὕδωρ εἰς τὴν οἰκίαν φέρε.»", "Миррина спрашивает, почему дочь ещё здесь, и велит ей скорее идти к источнику за водой. (Стр. 72.)"], ["Διὰ τί ἡ μήτηρ κελεύει τὴν Μέλιτταν ἄλλην ὑδρίαν φέρειν;", "Ἡ μήτηρ κελεύει τὴν Μέλιτταν ἄλλην ὑδρίαν φέρειν, ἐπεὶ ἡ Μέλιττα τὴν πρώτην ὑδρίαν κατέβαλε καὶ ἔθραυσεν.", "Мать велит принести другую гидрию, поскольку Мелитта уронила и разбила первую. (Стр. 67.)"], ["Τί κακὸν πάσχει αὖθις ἡ Μέλιττα;", "Ἡ Μέλιττα αὖθις πταίει καὶ πίπτει πρὸς τὴν γῆν καὶ θραύει τὴν ὑδρίαν.", "Мелитта снова спотыкается, падает и разбивает гидрию. (Стр. 74.)"], ["Τί ποιεῖ ἡ Παμφίλη ὅτε ἡ Μέλιττα αὖθις τὴν ὑδρίαν θραύει;", "Ἡ Παμφίλη οἴκαδε τρέχει καὶ ἄλλην ὑδρίαν φέρει· ἔπειτα πρὸς τὴν κρήνην σπεύδει καὶ τὴν ὑδρίαν γεμίζει καὶ τῇ Μελίττῃ παρέχει.", "Памфила бежит домой за другой гидрией, наполняет её у источника и отдаёт Мелитте. (Стр. 74.)"]];const root=document.getElementById('exercise');items.forEach((x,i)=>{const section=document.createElement('section');section.className='item';const question=document.createElement('p');question.className='question';question.lang='grc';question.textContent=(i+1)+'. '+x[0];const input=document.createElement('textarea');input.className='answer';input.lang='grc';input.rows=2;input.spellcheck=false;input.setAttribute('aria-label','Ответ на вопрос '+(i+1));const details=document.createElement('details');details.className='sample';const summary=document.createElement('summary');summary.textContent='Показать образец ответа';const answer=document.createElement('p');answer.className='text';answer.lang='grc';answer.textContent=x[1];const translation=document.createElement('p');translation.className='translation';translation.textContent=x[2];details.append(summary,answer,translation);section.append(question,input,details);root.append(section);});document.getElementById('clear').addEventListener('click',()=>{document.querySelectorAll('.answer').forEach(e=>e.value='')});</script></body></html>
