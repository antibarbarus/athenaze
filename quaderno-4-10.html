<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quaderno 4.10</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono&display=swap">
<style>
body{margin:20px;max-width:1100px;font-family:'Fira Mono',monospace;font-size:16px;line-height:1.6;color:#222}a{color:inherit}h1{margin-bottom:6px}h2{font-weight:normal;font-size:20px;margin-top:0}.instructions{font-style:italic;margin:12px 0 24px}.columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 30px}.group{border-bottom:1px solid #ddd;padding:11px 0;min-height:56px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.n{font-size:13px;color:#777;min-width:25px}.greek{font-size:20px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.choice{border:1px solid #c7c7c7;background:white;border-radius:4px;padding:4px 8px;font:inherit;font-size:20px;color:inherit;cursor:pointer}.choice:hover{background:#f3f3f3}.choice.selected{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}.choice.correct{background:lightgreen}.choice.wrong{background:lightcoral}.comma{font-size:19px;margin-left:-3px}.result{margin-top:24px;font-weight:bold}.actions{display:flex;gap:10px;margin-top:17px}.reset{font:inherit;padding:6px 12px;border:1px solid #aaa;border-radius:4px;background:#fafafa;cursor:pointer}.small{font-size:13px;color:#555;margin-top:24px}@media(max-width:720px){.columns{grid-template-columns:1fr}.group{padding:8px 0}}
</style></head><body>
<p><a href="https://antibarbarus.github.io/athenaze/quaderno.html">&lt; назад</a></p>
<h1>Quaderno 4.10</h1><h2>Выберите правильную форму</h2>
<p class="instructions">В каждой паре нажмите на правильную форму существительного или артикля (в соответствии с падежом и склонением). Выбранная форма будет подчёркнута; зелёный цвет означает правильный ответ, красный — ошибку.</p>
<div class="columns" id="exercise"></div>
<p class="result" id="result" aria-live="polite"></p>
<div class="actions"><button class="reset" id="reset" type="button">Очистить ответы</button></div>
<p class="small"><a href="https://antibarbarus.github.io/athenaze/grammar-volume-1.html">Справочная грамматика</a></p>
<script>
// Порядок сохранён по столбцам учебника: 1–6 слева, 7–12 справа.
const items=[
 {pre:'',forms:['αἱ','οἱ'],post:'ὁδοί',right:0},
 {pre:'τὰς',forms:['ῥάβδας','ῥάβδους'],post:'',right:1},
 {pre:'τὴν',forms:['θάλατταν','θάλαττην'],post:'',right:0},
 {pre:'',forms:['τῷ','τῇ'],post:'ἀμπέλῳ',right:1},
 {pre:'τῇ',forms:['χώρᾳ','χώρῃ'],post:'',right:0},
 {pre:'τῶν',forms:['κλίνων','κλινῶν'],post:'',right:1},
 {pre:'τὴν',forms:['ὁδήν','ὁδόν'],post:'',right:1},
 {pre:'τῇ',forms:['οἰκίᾳ','οἰκίῃ'],post:'',right:0},
 {pre:'τῆς',forms:['κόρης','κόρας'],post:'',right:0},
 {pre:'τῇ',forms:['χώρῃ','χώρᾳ'],post:'',right:1},
 {pre:'ταῖς',forms:['ἀμπέλοις','ἀμπέλαις'],post:'',right:0},
 {pre:'',forms:['τῷ','τῇ'],post:'δεσπότῃ',right:0}
];
const answers=Array(items.length).fill(null);
const el=document.getElementById('exercise');
items.forEach((item,i)=>{
 const line=document.createElement('div');line.className='group';line.dataset.item=i;
 const num=document.createElement('span');num.className='n';num.textContent=(i+1)+'.';line.appendChild(num);
 const greek=document.createElement('div');greek.className='greek';greek.lang='grc';
 if(item.pre){const t=document.createElement('span');t.textContent=item.pre;greek.appendChild(t)}
 item.forms.forEach((word,j)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=word;b.dataset.option=j;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{answers[i]=j;update();});greek.appendChild(b);if(j===0){const c=document.createElement('span');c.className='comma';c.textContent=',';greek.appendChild(c)}});
 if(item.post){const t=document.createElement('span');t.textContent=item.post;greek.appendChild(t)}
 line.appendChild(greek);el.appendChild(line);
});
function update(){let right=0,done=0;[...el.children].forEach((line,i)=>{const v=answers[i];if(v!==null){done++;if(v===items[i].right)right++;}line.querySelectorAll('button.choice').forEach((b,j)=>{const chosen=v===j;b.classList.toggle('selected',chosen);b.classList.toggle('correct',chosen&&j===items[i].right);b.classList.toggle('wrong',chosen&&j!==items[i].right);b.setAttribute('aria-pressed',String(chosen))})});document.getElementById('result').textContent=`Правильно: ${right} из ${items.length}. Выбрано: ${done} из ${items.length}.`;}
document.getElementById('reset').addEventListener('click',()=>{answers.fill(null);update()});update();
</script></body></html>
